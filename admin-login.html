<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TomBrian | Admin Sign In</title>
<style>
:root{color-scheme:dark;--bg:#05070d;--panel:#111624;--gold:#d9a441;--muted:#98a2b3;--line:#293244}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:#f7f8fb;font-family:Arial,Helvetica,sans-serif}
.card{width:min(100%,420px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 20px 60px #0006}
.brand{font-size:23px;font-weight:900;color:var(--gold)}h1{font-size:22px;margin:22px 0 7px}.muted{font-size:13px;line-height:1.5;color:var(--muted)}
label{display:block;font-size:13px;margin:17px 0 7px}input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#090e18;color:white;font:inherit}
button{width:100%;padding:13px;margin-top:20px;border:0;border-radius:10px;background:var(--gold);color:#17130b;font-weight:800;font-size:15px}
#message{margin-top:14px;font-size:13px;line-height:1.5;color:#ffb2b2;min-height:18px}.back{display:inline-block;margin-top:18px;color:var(--gold);font-size:13px;text-decoration:none}
</style></head><body><main class="card">
<div class="brand">TomBrian</div><h1>Administrator sign in</h1><p class="muted">This private sign-in is only for approved TomBrian administrators. Customer and agent accounts cannot open the administration area.</p>
<form id="adminLoginForm">
<label for="email">Administrator email</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<button id="submitBtn" type="submit">Sign in to Admin</button><div id="message" role="status"></div>
</form><a class="back" href="login.html">← Back to customer sign in</a>
</main>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase=createClient("https://ekqhsnzkovzmepxdajtu.supabase.co","sb_publishable_v4DmfQMCBRvJE_dJvgk1og_v6JMXE_r");
const form=document.getElementById("adminLoginForm"),message=document.getElementById("message"),button=document.getElementById("submitBtn");
async function verifyAdmin(user){
 const {data,error}=await supabase.from("profiles").select("role").eq("id",user.id).maybeSingle();
 if(error)throw error;
 return String(data?.role||"").toLowerCase()==="admin";
}
form.addEventListener("submit",async event=>{
 event.preventDefault();message.textContent="Verifying administrator account…";button.disabled=true;
 try{
  const {data,error}=await supabase.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});
  if(error)throw error;
  if(!(await verifyAdmin(data.user))){message.textContent="Access denied. This account is not an approved administrator.";return;}
  location.replace("admin.html");
 }catch(error){message.textContent=error.message||"Sign in failed. Please try again.";}
 finally{button.disabled=false;}
});
(async()=>{try{const {data:{session}}=await supabase.auth.getSession();if(session&&await verifyAdmin(session.user))location.replace("admin.html");}catch(error){console.warn("Admin session check:",error);}})();
</script></body></html>
