<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TomBrian | Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #05070d;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      color: #d9a441;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .tagline {
      text-align: center;
      color: #8f97a5;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .card {
      background: #11151f;
      border: 1px solid #252b37;
      border-radius: 16px;
      padding: 30px 24px;
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9da5b3;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #303746;
      background: #080b12;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #d9a441;
    }

    input::placeholder {
      color: #687180;
    }

    .login-button {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      background: #d9a441;
      color: #05070d;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-button:hover {
      opacity: 0.9;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .forgot {
      display: block;
      text-align: right;
      margin-top: 12px;
      color: #d9a441;
      text-decoration: none;
      font-size: 13px;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .message {
      display: none;
      margin-bottom: 20px;
      padding: 13px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      background: #12351f;
      border: 1px solid #24733d;
      color: #8ff0aa;
    }

    .message.error {
      display: block;
      background: #351519;
      border: 1px solid #7b2933;
      color: #ff9da6;
    }

    .message.info {
      display: block;
      background: #111f35;
      border: 1px solid #294d7b;
      color: #9dc5ff;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;
      color: #737b89;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #2a303b;
    }

    .signup {
      text-align: center;
      color: #9da5b3;
      font-size: 14px;
    }

    .signup a {
      color: #d9a441;
      text-decoration: none;
      font-weight: 700;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #8f97a5;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #d9a441;
    }

    @media (max-width: 480px) {
      .card {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">TomBrian</div>

    <div class="tagline">
      Simple • Secure • Connected
    </div>

    <div class="card">

      <h1>Welcome Back</h1>

      <p class="subtitle">
        Login to your TomBrian account
      </p>

      <!-- =====================================================
           MESSAGE AREA
           ===================================================== -->

      <div id="message" class="message"></div>


      <!-- =====================================================
           LOGIN FORM
           ===================================================== -->

      <form id="loginForm">

        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >
          Login
        </button>

      </form>


      <!-- =====================================================
           FORGOT PASSWORD
           ===================================================== -->

      <a
        href="#"
        class="forgot"
        id="forgotPassword"
      >
        Forgot Password?
      </a>


      <!-- =====================================================
           DIVIDER
           ===================================================== -->

      <div class="divider">
        OR
      </div>


      <!-- =====================================================
           CREATE ACCOUNT
           ===================================================== -->

      <div class="signup">

        Don't have an account?

        <a href="signup.html">
          Create Account
        </a>

      </div>

    </div>


    <!-- =======================================================
         BACK HOME
         ======================================================= -->

    <a
      href="index.html"
      class="back"
    >
      ← Back to TomBrian Home
    </a>

  </div>


  <!-- =========================================================
       SUPABASE + LOGIN JAVASCRIPT
       ========================================================= -->

  <script type="module">

    /* =========================================================
       LOAD SUPABASE
       ========================================================= */

    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    /* =========================================================
       TOMBRIAN SUPABASE CONNECTION
       ========================================================= */

    const SUPABASE_URL =
      "https://ekqhsnzkovzmepxdajtu.supabase.co";


    /* =========================================================
       PASTE YOUR SUPABASE PUBLISHABLE KEY BELOW

       IMPORTANT:
       Use the SAME publishable key that you used in signup.html.

       DO NOT use the Supabase SECRET / SERVICE ROLE key.
       ========================================================= */

    const SUPABASE_PUBLISHABLE_KEY =
      "PASTE_YOUR_PUBLISHABLE_KEY_HERE";


    /* =========================================================
       CONNECT TO SUPABASE
       ========================================================= */

    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================================================
       GET PAGE ELEMENTS
       ========================================================= */

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const forgotPassword =
      document.getElementById("forgotPassword");

    const message =
      document.getElementById("message");


    /* =========================================================
       SHOW MESSAGE
       ========================================================= */

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

      message.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

    }


    /* =========================================================
       LOGIN
       ========================================================= */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        /* -----------------------------------------------------
           GET LOGIN DETAILS
           ----------------------------------------------------- */

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        /* -----------------------------------------------------
           BASIC VALIDATION
           ----------------------------------------------------- */

        if (!email) {

          showMessage(
            "Please enter your email address.",
            "error"
          );

          return;
        }


        if (!password) {

          showMessage(
            "Please enter your password.",
            "error"
          );

          return;
        }


        /* -----------------------------------------------------
           DISABLE LOGIN BUTTON
           ----------------------------------------------------- */

        loginButton.disabled = true;

        loginButton.textContent =
          "Logging in...";


        try {

          /* ---------------------------------------------------
             SUPABASE LOGIN
             --------------------------------------------------- */

          const { data, error } =
            await supabase.auth.signInWithPassword({

              email: email,

              password: password

            });


          /* ---------------------------------------------------
             CHECK LOGIN ERROR
             --------------------------------------------------- */

          if (error) {

            throw error;

          }


          /* ---------------------------------------------------
             CHECK USER
             --------------------------------------------------- */

          if (!data.user) {

            throw new Error(
              "Login was not completed. Please try again."
            );

          }


          /* ---------------------------------------------------
             SUCCESS
             --------------------------------------------------- */

          showMessage(
            "Login successful! Redirecting...",
            "success"
          );


          loginButton.textContent =
            "Success!";


          /* ---------------------------------------------------
             REDIRECT
             --------------------------------------------------- */

          setTimeout(
            function() {

              window.location.href =
                "dashboard.html";

            },
            1000
          );


        } catch (error) {

          console.error(
            "TomBrian Login Error:",
            error
          );


          let errorMessage =
            error && error.message
              ? error.message
              : "Something went wrong while logging in.";


          const lowerErrorMessage =
            errorMessage.toLowerCase();


          /* ---------------------------------------------------
             INVALID LOGIN
             --------------------------------------------------- */

          if (
            lowerErrorMessage.includes(
              "invalid login credentials"
            )
          ) {

            errorMessage =
              "Incorrect email or password. Please check your details and try again.";

          }


          /* ---------------------------------------------------
             EMAIL NOT CONFIRMED
             --------------------------------------------------- */

          if (
            lowerErrorMessage.includes(
              "email not confirmed"
            )
          ) {

            errorMessage =
              "Your email has not been verified yet. Please open the verification email sent by TomBrian and click the verification link before logging in.";

          }


          /* ---------------------------------------------------
             INVALID API KEY
             --------------------------------------------------- */

          if (
            lowerErrorMessage.includes(
              "invalid api key"
            )
          ) {

            errorMessage =
              "Supabase connection failed. Please check the publishable key in login.html.";

          }


          /* ---------------------------------------------------
             SHOW ERROR
             --------------------------------------------------- */

          showMessage(
            "Login failed: " + errorMessage,
            "error"
          );


          /* ---------------------------------------------------
             ENABLE BUTTON AGAIN
             --------------------------------------------------- */

          loginButton.disabled = false;

          loginButton.textContent =
            "Login";

        }

      }
    );


    /* =========================================================
       FORGOT PASSWORD
       ========================================================= */

    forgotPassword.addEventListener(
      "click",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        /* -----------------------------------------------------
           EMAIL REQUIRED
           ----------------------------------------------------- */

        if (!email) {

          showMessage(
            "Please enter your email address first, then click Forgot Password.",
            "error"
          );

          return;
        }


        try {

          forgotPassword.textContent =
            "Sending...";


          /* ---------------------------------------------------
             SEND PASSWORD RESET EMAIL
             --------------------------------------------------- */

          const { error } =
            await supabase.auth.resetPasswordForEmail(
              email,
              {
                redirectTo:
                  window.location.origin +
                  "/reset-password.html"
              }
            );


          if (error) {

            throw error;

          }


          showMessage(
            "Password reset instructions have been sent to your email. Please check your inbox.",
            "success"
          );


        } catch (error) {

          console.error(
            "Password Reset Error:",
            error
          );


          showMessage(
            "Password reset failed: " +
            (
              error && error.message
                ? error.message
                : "Please try again."
            ),
            "error"
          );

        }


        forgotPassword.textContent =
          "Forgot Password?";

      }
    );


  </script>

</body>
</html>
