name: TomBrian Agent APK Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect Flutter source archive
        run: |
          unzip -l main_corrected.zip
          mkdir -p build_src
          unzip -q main_corrected.zip -d build_src
          find build_src -maxdepth 6 -type f -print
