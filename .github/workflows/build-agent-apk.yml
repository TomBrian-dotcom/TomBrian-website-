name: Build TomBrian Agent APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter source
        shell: bash
        run: |
          rm -rf build_src
          mkdir -p build_src
          unzip -q main_corrected.zip -d build_src

          PUBSPEC="$(find build_src -name pubspec.yaml -type f | head -n 1)"
          MAIN="$(find build_src -name main.dart -type f | head -n 1)"

          if [ -z "$MAIN" ]; then
            echo "No main.dart found in main_corrected.zip"
            find build_src -maxdepth 5 -type f -print
            exit 1
          fi

          if [ -n "$PUBSPEC" ]; then
            APP_DIR="$(dirname "$PUBSPEC")"
          else
            APP_DIR="$GITHUB_WORKSPACE/build_src/tombrian_app"
            mkdir -p "$APP_DIR/lib"
            cp "$MAIN" "$APP_DIR/lib/main.dart"

            cat > "$APP_DIR/pubspec.yaml" <<'YAML'
name: tombrian
publish_to: 'none'
description: TomBrian airtime sales app.
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.0
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.2
  app_links: ^6.4.1

flutter:
  uses-material-design: true
YAML
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Flutter source:"
          echo "$APP_DIR"
          wc -l "$APP_DIR"/lib/main.dart

      - name: Patch Agent Dashboard
        working-directory: ${{ env.APP_DIR }}
        run: |
          python "$GITHUB_WORKSPACE/tools/patch_agent_dashboard.py"
          grep -n "commissionRate\|unreadNotificationCount\|refreshAgentDashboard" lib/main.dart

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: ${{ env.APP_DIR }}
        run: flutter create --platforms=android .

      - name: Get dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tombrian-agent-dashboard-${{ github.run_number }}
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
