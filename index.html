<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TomBrian | Simple • Secure • Connected</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #05070d;
      color: #ffffff;
      line-height: 1.6;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 7, 13, 0.96);
      border-bottom: 1px solid #242936;
      padding: 16px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #d9a441;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    nav {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      color: #d9a441;
    }

    .nav-login {
      border: 1px solid #d9a441;
      color: #d9a441 !important;
      padding: 8px 14px;
      border-radius: 7px;
    }

    .hero {
      min-height: 78vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 70px 20px;
      background:
        radial-gradient(circle at top, #172033 0%, #05070d 55%);
    }

    .hero-content {
      max-width: 850px;
    }

    .badge {
      display: inline-block;
      color: #d9a441;
      border: 1px solid #514426;
      background: #12100a;
      padding: 7px 14px;
      border-radius: 30px;
      font-size: 13px;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: clamp(42px, 8vw, 72px);
      line-height: 1.05;
      margin-bottom: 22px;
    }

    .gold {
      color: #d9a441;
    }

    .hero p {
      color: #b8bfcc;
      font-size: 18px;
      max-width: 680px;
      margin: 0 auto 32px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-block;
      padding: 14px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      transition: 0.2s;
    }

    .primary {
      background: #d9a441;
      color: #05070d;
    }

    .primary:hover {
      opacity: 0.9;
    }

    .secondary {
      border: 1px solid #d9a441;
      color: #d9a441;
    }

    .secondary:hover {
      background: #d9a441;
      color: #05070d;
    }

    section {
      padding: 75px 6%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title h2 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .section-title p {
      color: #9da5b3;
    }

    .services {
      background: #090c13;
    }

    .cards {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: #11151f;
      border: 1px solid #252b37;
      border-radius: 14px;
      padding: 28px 22px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #d9a441;
    }

    .icon {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .card h3 {
      color: #d9a441;
      margin-bottom: 9px;
      font-size: 20px;
    }

    .card p {
      color: #aeb5c2;
      font-size: 14px;
    }

    .about {
      max-width: 850px;
      margin: auto;
      text-align: center;
    }

    .about p {
      color: #b1b8c4;
      margin-bottom: 18px;
    }

    .cta {
      text-align: center;
      background: linear-gradient(180deg, #0b0e16, #11151f);
    }

    .cta h2 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .cta p {
      color: #aeb5c2;
      margin-bottom: 25px;
    }

    footer {
      padding: 30px 20px;
      text-align: center;
      border-top: 1px solid #242936;
      color: #818997;
      font-size: 13px;
    }

    .footer-logo {
      color: #d9a441;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    @media (max-width: 600px) {
      header {
        padding: 14px 18px;
      }

      .logo {
        font-size: 22px;
      }

      nav {
        gap: 10px;
      }

      nav a:not(.nav-login) {
        display: none;
      }

      .hero {
        min-height: 72vh;
        padding: 55px 18px;
      }

      .hero p {
        font-size: 16px;
      }

      section {
        padding: 60px 18px;
      }

      .section-title h2 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">TomBrian</div>

    <nav>
      <a href="#services">Services</a>
      <a href="#about">About</a>
